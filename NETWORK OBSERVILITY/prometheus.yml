global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ntp-host-metrics'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'snmp-devices'
    metrics_path: /snmp
    params:
      module: [if_mib]
    file_sd_configs:
      - files:
        - /etc/prometheus/targets.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp_exporter:9116

  - job_name: 'netflow-v9-udp'
    static_configs:
      - targets: ['goflow-udp:8080']

  - job_name: 'netflow-v9-tcp'
    static_configs:
      - targets: ['goflow2-tcp:8081']
